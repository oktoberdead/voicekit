name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/VoiceKit.Core.Tests -c Release --logger trx
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build VoiceKit.slnx -c Release
      - run: dotnet test tests/VoiceKit.Core.Tests -c Release --no-build --logger trx
      - run: dotnet publish src/VoiceKit.Windows -c Release -r win-x64 --self-contained true -o artifacts/VoiceKit
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceKit-win-x64
          path: artifacts/VoiceKit/
